<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Bakalaa - Order food from your favorite restaurants. Fast delivery, great prices, and a wide selection of cuisines. Discover local restaurants and enjoy delicious meals delivered to your door." />
    <title>Bakalaa - Food Delivery & Restaurant Ordering</title>
    <!-- Performance optimizations -->
    <meta http-equiv="Cache-Control" content="public, max-age=31536000, immutable" />
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://maps.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://maps.googleapis.com" crossorigin />
    <!-- Google Maps API will be loaded dynamically from environment variable -->
    <!-- CRITICAL: Inline styles to prevent FOUC (Flash of Unstyled Content) and blink -->
    <style>
      /* Prevent any blink on initial load */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background-color: #ffffff;
        color: #000000;
      }
      
      /* Ensure root div matches app background immediately */
      #root {
        width: 100%;
        min-height: 100vh;
        background-color: #ffffff;
        opacity: 1;
        transition: none;
        animation: none;
      }
      
      /* Prevent any transitions until body.loaded class is added */
      * {
        transition: none !important;
        animation: none !important;
      }
      
      /* Hide any loading spinners or fallbacks */
      [class*="loading"],
      [class*="Loading"],
      [class*="spinner"],
      [class*="Spinner"] {
        display: none !important;
      }
    </style>
  </head>
  <body> 
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
